name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build Nl2Sql.slnx --configuration Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7.0.1
      # Pinned to an exact release: the floating v1 tag is frozen at an old version.
      # Vite+ resolves Node from engines.node in src/web/package.json.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          working-directory: src/web
          cache: true
      - run: vp check
      - run: vp build
